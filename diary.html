<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일상 · 추억 - 멍멍도감</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="diary">
  <div id="header"></div>

  <main>
    <section class="hero-simple">
      <h1>일상 · 추억</h1>
      <p>강아지들의 하루 일과와 소중한 추억들을 소개할게요.</p>
    </section>

    <section class="section container">
      <h2 class="section-title">추억 이야기</h2>
      <div class="card-grid">
        <div class="episode-card">
          <span class="dog-name-tag">코코</span>
          <h3>첫 만남</h3>
          <p>2023년 봄, 처음 가족이 된 날을 아직도 기억해요.</p>
        </div>
        <div class="episode-card">
          <span class="dog-name-tag">몽치</span>
          <h3>첫 바다 여행</h3>
          <p>처음 본 바다에 신나서 뛰어다니던 몽치.</p>
        </div>
        <div class="episode-card">
          <span class="dog-name-tag">두부</span>
          <h3>눈 오던 날</h3>
          <p>태어나서 처음 본 눈에 폴짝폴짝 뛰던 모습.</p>
        </div>
        <div class="episode-card">
          <span class="dog-name-tag">초코</span>
          <h3>미용실 데뷔</h3>
          <p>처음 미용하고 와서 다들 못 알아본 그날.</p>
        </div>
        <div class="episode-card">
          <span class="dog-name-tag">보리</span>
          <h3>공원 대소동</h3>
          <p>공원에서 다른 강아지 친구를 사귄 날.</p>
        </div>
        <div class="episode-card">
          <span class="dog-name-tag">전체</span>
          <h3>다섯 마리 첫 단체 사진</h3>
          <p>다섯 마리가 처음 다 같이 모여 찍은 사진.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
