<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소개 - 그린테이블</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">
  <div id="header"></div>

  <main>
    <section class="hero">
      <h1>그린테이블 이야기</h1>
      <p>작은 동네 카페에서 시작해, 건강한 한 끼를 나누는 공간이 되었습니다.</p>
    </section>

    <section class="section container">
      <h2 class="section-title">브랜드 스토리</h2>
      <p style="max-width:640px; margin: 0 auto 24px; color: var(--muted);">
        2021년, "매일 먹어도 부담 없는 건강한 한 끼"를 만들자는 마음으로 그린테이블을 시작했습니다.
        신선한 채소와 좋은 재료를 고집하며, 동네 분들이 편하게 들를 수 있는 공간을 만들어가고 있습니다.
      </p>
    </section>

    <section class="section container">
      <h2 class="section-title">연혁</h2>
      <div class="card-grid">
        <div class="card">
          <h3>2021</h3>
          <p>그린테이블 1호점 오픈</p>
        </div>
        <div class="card">
          <h3>2023</h3>
          <p>샐러드 메뉴 라인 확장</p>
        </div>
        <div class="card">
          <h3>2025</h3>
          <p>단골 손님 1,000명 돌파</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
