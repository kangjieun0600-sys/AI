<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로필 - 멍멍도감</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <div id="header"></div>

  <main>
    <section class="hero-simple">
      <h1>강아지 프로필</h1>
      <p>다섯 마리 강아지들을 소개할게요.</p>
    </section>

    <section class="section container">
      <div class="dog-grid">
        <div class="dog-card">
          <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=60" alt="코코">
          <div class="dog-card-body">
            <h3>코코</h3>
            <p class="dog-meta">포메라니안 · 3살 · 여아</p>
            <div class="tag-list">
              <span class="tag">애교쟁이</span>
              <span class="tag">호기심 많음</span>
            </div>
          </div>
        </div>

        <div class="dog-card">
          <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=500&q=60" alt="몽치">
          <div class="dog-card-body">
            <h3>몽치</h3>
            <p class="dog-meta">진돗개 · 2살 · 남아</p>
            <div class="tag-list">
              <span class="tag">씩씩함</span>
              <span class="tag">충직함</span>
            </div>
          </div>
        </div>

        <div class="dog-card">
          <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=500&q=60" alt="두부">
          <div class="dog-card-body">
            <h3>두부</h3>
            <p class="dog-meta">말티즈 · 1살 · 남아</p>
            <div class="tag-list">
              <span class="tag">장난꾸러기</span>
              <span class="tag">활동적</span>
            </div>
          </div>
        </div>

        <div class="dog-card">
          <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=500&q=60" alt="초코">
          <div class="dog-card-body">
            <h3>초코</h3>
            <p class="dog-meta">푸들 · 4살 · 여아</p>
            <div class="tag-list">
              <span class="tag">차분함</span>
              <span class="tag">똑똑함</span>
            </div>
          </div>
        </div>

        <div class="dog-card">
          <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=500&q=60" alt="보리">
          <div class="dog-card-body">
            <h3>보리</h3>
            <p class="dog-meta">웰시코기 · 2살 · 남아</p>
            <div class="tag-list">
              <span class="tag">활발함</span>
              <span class="tag">먹보</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
