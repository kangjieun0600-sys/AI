<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오시는 길 - 그린테이블</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="header"></div>

  <main>
    <section class="hero">
      <h1>오시는 길</h1>
      <p>편하게 방문해주세요.</p>
    </section>

    <section class="section container">
      <ul class="info-list" style="max-width:480px; margin: 0 auto 40px;">
        <li><strong>주소</strong> 서울시 마포구 example로 12</li>
        <li><strong>전화</strong> 02-1234-5678</li>
        <li><strong>영업시간</strong> 매일 10:00 - 21:00 (연중무휴)</li>
        <li><strong>이메일</strong> <a href="mailto:hello@greentable.example" style="color: var(--accent);">hello@greentable.example</a></li>
      </ul>

      <div class="map-embed">
        <iframe
          src="https://www.openstreetmap.org/export/embed.html?bbox=126.9%2C37.54%2C126.96%2C37.57&layer=mapnik"
          loading="lazy"
          title="그린테이블 위치 지도"></iframe>
      </div>

      <p style="text-align:center; margin-top: 24px; color: var(--muted);">
        문의사항은 이메일로 편하게 보내주세요.
        <a href="mailto:hello@greentable.example" class="btn" style="margin-top:16px;">이메일 보내기</a>
      </p>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
