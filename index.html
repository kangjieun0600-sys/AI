<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멍멍도감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <div id="header"></div>

  <main>
    <div class="swiper hero-swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=1200&q=70" alt="코코">
          <div class="slide-caption">
            <div class="dog-name">코코</div>
            <div class="dog-breed">포메라니안 · 3살</div>
          </div>
        </div>
        <div class="swiper-slide">
          <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=70" alt="몽치">
          <div class="slide-caption">
            <div class="dog-name">몽치</div>
            <div class="dog-breed">진돗개 · 2살</div>
          </div>
        </div>
        <div class="swiper-slide">
          <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=1200&q=70" alt="두부">
          <div class="slide-caption">
            <div class="dog-name">두부</div>
            <div class="dog-breed">말티즈 · 1살</div>
          </div>
        </div>
        <div class="swiper-slide">
          <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1200&q=70" alt="초코">
          <div class="slide-caption">
            <div class="dog-name">초코</div>
            <div class="dog-breed">푸들 · 4살</div>
          </div>
        </div>
        <div class="swiper-slide">
          <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=1200&q=70" alt="보리">
          <div class="slide-caption">
            <div class="dog-name">보리</div>
            <div class="dog-breed">웰시코기 · 2살</div>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <section class="intro">
      <h1>우리 동네 강아지들을 소개합니다</h1>
      <p>다섯 마리의 사랑스러운 강아지들, 각자의 이야기를 만나보세요.</p>
    </section>

    <section class="section container">
      <div class="card-grid">
        <a href="profile.html" class="card">
          <h3>프로필</h3>
          <p>다섯 마리 강아지들의 기본 정보와 성격을 확인하세요.</p>
        </a>
        <a href="gallery.html" class="card">
          <h3>사진첩</h3>
          <p>강아지들의 귀여운 순간들을 모아둔 사진첩이에요.</p>
        </a>
        <a href="diary.html" class="card">
          <h3>일상 · 추억</h3>
          <p>강아지들의 하루 일과와 추억 이야기를 만나보세요.</p>
        </a>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
