<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그린테이블</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <div id="header"></div>

  <main>
    <section class="hero">
      <h1>매일 아침 만드는 건강한 한 끼, 그린테이블</h1>
      <p>신선한 재료로 만든 샌드위치와 샐러드, 커피를 즐길 수 있는 동네 카페입니다.</p>
      <a href="services.html" class="btn">메뉴 보기</a>
    </section>

    <section class="section container">
      <h2 class="section-title">그린테이블의 특징</h2>
      <div class="card-grid">
        <div class="card">
          <h3>신선한 재료</h3>
          <p>매일 아침 들어오는 채소와 빵으로 만듭니다.</p>
        </div>
        <div class="card">
          <h3>편안한 공간</h3>
          <p>혼자 오셔도, 여럿이 오셔도 편안한 좌석 구성.</p>
        </div>
        <div class="card">
          <h3>합리적인 가격</h3>
          <p>매일 부담 없이 찾을 수 있는 가격대를 유지합니다.</p>
        </div>
      </div>
    </section>

    <section class="section container">
      <h2 class="section-title">오시는 길</h2>
      <p style="text-align:center; color: var(--muted);">
        서울시 마포구 example로 12 · 매일 10:00 - 21:00<br>
        <a href="contact.html" style="color: var(--accent); font-weight:600;">자세히 보기 →</a>
      </p>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
