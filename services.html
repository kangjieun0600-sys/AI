<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 - 그린테이블</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">
  <div id="header"></div>

  <main>
    <section class="hero">
      <h1>메뉴</h1>
      <p>매일 신선하게 준비하는 그린테이블의 메뉴를 소개합니다.</p>
    </section>

    <section class="section container">
      <h2 class="section-title">샌드위치</h2>
      <div class="menu-list">
        <div class="menu-item"><span>아보카도 치킨 샌드위치</span><span class="price">7,900원</span></div>
        <div class="menu-item"><span>에그 샌드위치</span><span class="price">6,500원</span></div>
        <div class="menu-item"><span>햄치즈 샌드위치</span><span class="price">6,900원</span></div>
      </div>
    </section>

    <section class="section container">
      <h2 class="section-title">샐러드</h2>
      <div class="menu-list">
        <div class="menu-item"><span>그릭요거트 샐러드</span><span class="price">8,500원</span></div>
        <div class="menu-item"><span>퀴노아 샐러드</span><span class="price">8,900원</span></div>
      </div>
    </section>

    <section class="section container">
      <h2 class="section-title">음료</h2>
      <div class="menu-list">
        <div class="menu-item"><span>아메리카노</span><span class="price">4,000원</span></div>
        <div class="menu-item"><span>카페라떼</span><span class="price">4,500원</span></div>
        <div class="menu-item"><span>콜드브루</span><span class="price">4,800원</span></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
