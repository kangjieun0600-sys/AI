<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <span class="logo">AI Page</span>
    <button id="theme-toggle" aria-label="테마 전환">🌙</button>
  </header>

  <main>
    <section class="hero">
      <h1>간단한 테스트 페이지</h1>
      <p>구조와 디자인을 확인해보기 위한 연습용 페이지입니다.</p>
    </section>

    <section class="cards">
      <article class="card">
        <h2>섹션 1</h2>
        <p>이 영역은 카드형 레이아웃을 확인하기 위한 예시 내용입니다.</p>
      </article>
      <article class="card">
        <h2>섹션 2</h2>
        <p>필요한 내용으로 자유롭게 바꿔서 쓸 수 있습니다.</p>
      </article>
      <article class="card">
        <h2>섹션 3</h2>
        <p>반응형 레이아웃이라 화면 폭이 좁아지면 세로로 쌓입니다.</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 AI Page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
